<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img"><title>Reference taxonomy</title><desc>The six configurations grouped by reference, predicted component, and retained output</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#172c43"/></marker></defs><rect x="0" y="0" width="1100" height="590" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="1100" height="8" rx="0" fill="#007f76" stroke="none"/><text x="30" y="37" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#007f76" font-weight="700" text-anchor="start">DESIGN MAP</text><text x="30" y="69" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172c43" font-weight="700" text-anchor="start">Six adaptive configurations, three reference families</text><text x="30" y="97" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#52677a" font-weight="400" text-anchor="start">Select by the available reference and whether the predictable component is signal or interference.</text><text x="42" y="143" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#52677a" font-weight="700" text-anchor="start">ID</text><text x="122" y="143" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#52677a" font-weight="700" text-anchor="start">Reference source</text><text x="455" y="143" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#52677a" font-weight="700" text-anchor="start">What the filter estimates</text><text x="780" y="143" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#52677a" font-weight="700" text-anchor="start">What is retained</text><rect x="28" y="160" width="1044" height="54" rx="8" fill="#eaf0f5" stroke="none"/><rect x="38" y="169" width="47" height="36" rx="8" fill="#bc641c" stroke="none"/><text x="61" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">A</text><text x="122" y="192" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="700" text-anchor="start">Synthetic sinusoid</text><text x="455" y="192" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="400" text-anchor="start">Periodic noise</text><text x="780" y="192" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#007f76" font-weight="700" text-anchor="start">Error  e = d − y</text><rect x="28" y="223" width="1044" height="54" rx="8" fill="#f4f8fb" stroke="none"/><rect x="38" y="232" width="47" height="36" rx="8" fill="#bc641c" stroke="none"/><text x="61" y="256" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">B</text><text x="122" y="255" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="700" text-anchor="start">Constant / previous row</text><text x="455" y="255" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="400" text-anchor="start">Row offset</text><text x="780" y="255" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#007f76" font-weight="700" text-anchor="start">Corrected primary</text><rect x="28" y="286" width="1044" height="54" rx="8" fill="#eaf0f5" stroke="none"/><rect x="38" y="295" width="47" height="36" rx="8" fill="#7853a8" stroke="none"/><text x="61" y="319" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">C</text><text x="122" y="318" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="700" text-anchor="start">Delayed high band</text><text x="455" y="318" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="400" text-anchor="start">Predictable interference</text><text x="780" y="318" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#007f76" font-weight="700" text-anchor="start">Error + preserved low band</text><rect x="28" y="349" width="1044" height="54" rx="8" fill="#f4f8fb" stroke="none"/><rect x="38" y="358" width="47" height="36" rx="8" fill="#2466a2" stroke="none"/><text x="61" y="382" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">D</text><text x="122" y="381" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="700" text-anchor="start">Blind-spot neighbours</text><text x="455" y="381" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="400" text-anchor="start">Predictable scene</text><text x="780" y="381" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#007f76" font-weight="700" text-anchor="start">Prediction y / gated selection</text><rect x="28" y="412" width="1044" height="54" rx="8" fill="#eaf0f5" stroke="none"/><rect x="38" y="421" width="47" height="36" rx="8" fill="#2466a2" stroke="none"/><text x="61" y="445" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">E</text><text x="122" y="444" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="700" text-anchor="start">Larger blind-spot window</text><text x="455" y="444" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="400" text-anchor="start">Predictable scene</text><text x="780" y="444" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#007f76" font-weight="700" text-anchor="start">Prediction y</text><rect x="28" y="475" width="1044" height="54" rx="8" fill="#f4f8fb" stroke="none"/><rect x="38" y="484" width="47" height="36" rx="8" fill="#007f76" stroke="none"/><text x="61" y="508" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">F</text><text x="122" y="507" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="700" text-anchor="start">Independent sensor</text><text x="455" y="507" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172c43" font-weight="400" text-anchor="start">Correlated interference</text><text x="780" y="507" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#007f76" font-weight="700" text-anchor="start">Error  e = d − y</text><text x="30" y="565" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#52677a" font-weight="700" text-anchor="start">Key distinction: LMS always uses prediction error for learning; the application need not keep that error.</text></svg>
